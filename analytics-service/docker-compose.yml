services:
  redis:
    image: redis:7.4-alpine
    # AOF (fsync раз в секунду) + RDB-снапшоты: данные переживают рестарты и сбои
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    ports: ["6379:6379"]
    volumes: ["./data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 2
    depends_on:
      redis: {condition: service_healthy}
